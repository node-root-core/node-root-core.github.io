name: Media Downloader (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Ссылка (YouTube, TikTok, Instagram и др.)'
        required: true
        type: string
      format:
        description: 'Формат'
        required: true
        default: 'video'
        type: choice
        options:
        - video
        - audio

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

    - name: Install yt-dlp
      run: pip install --upgrade yt-dlp

    - name: Download Media
      id: download
      run: |
        mkdir -p downloads
        URL="${{ github.event.inputs.video_url }}"
        FORMAT="${{ github.event.inputs.format }}"
        
        echo "🎯 Скачиваем: $URL"
        echo " Формат: $FORMAT"
        
        # Общие опции для обхода защиты
        COMMON_OPTS="--no-playlist --socket-timeout 30"
        
        if [ "$FORMAT" = "video" ]; then
          echo " YouTube видео"
          yt-dlp $COMMON_OPTS \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --extractor-args "youtube:player_client=web,android,ios" \
            -o "downloads/%(title)s.%(ext)s" \
            "$URL"
        else
          echo "🎵 YouTube аудио (MP3)"
          yt-dlp $COMMON_OPTS \
            -x --audio-format mp3 --audio-quality 0 \
            --extractor-args "youtube:player_client=web,android,ios" \
            -o "downloads/%(title)s.%(ext)s" \
            "$URL"
        fi
        
        # Проверяем результат
        echo "📁 Скачанные файлы:"
        ls -lh downloads/
        
        FILE_COUNT=$(find downloads -type f 2>/dev/null | wc -l)
        echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
        
        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "❌ Файлы не скачаны!"
          exit 1
        else
          echo "✅ Скачано файлов: $FILE_COUNT"
        fi

    - name: Upload Artifact
      if: steps.download.outputs.file_count > 0
      uses: actions/upload-artifact@v4
      with:
        name: academy-media-${{ github.run_id }}
        path: downloads/
        retention-days: 1
        if-no-files-found: warn
