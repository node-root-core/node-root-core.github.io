name: Media Downloader (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Ссылка (YouTube, TikTok, Instagram и др.)'
        required: true
        type: string
      format:
        description: 'Формат'
        required: true
        default: 'video'
        type: choice
        options:
        - video
        - audio

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install requests
      run: pip install requests

    - name: Download via Cobalt API
      id: download
      run: |
        mkdir -p downloads
        URL="${{ github.event.inputs.video_url }}"
        FORMAT="${{ github.event.inputs.format }}"
        
        echo "🎯 Скачиваем: $URL"
        
        # Используем Cobalt API (бесплатный, без лимитов)
        python3 << EOF
        import requests
        import json
        import time
        import os
        
        url = "$URL"
        audio_only = "$FORMAT" == "audio"
        
        # Cobalt API
        response = requests.post(
            "https://api.cobalt.tools/api/json",
            headers={
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            json={
                "url": url,
                "vCodec": "h264" if not audio_only else "mp3",
                "vQuality": "720" if not audio_only else "128",
                "aFormat": "mp3" if audio_only else None,
                "filenamePattern": "basic",
                "isAudioOnly": audio_only,
                "isTTFullAudio": False
            }
        )
        
        data = response.json()
        print(f"API Response: {json.dumps(data, indent=2)}")
        
        if data.get("status") == "error":
            print(f" Ошибка API: {data.get('text', 'Unknown error')}")
            exit(1)
        
        if "url" not in data:
            print("❌ Нет URL в ответе API")
            exit(1)
        
        download_url = data["url"]
        print(f"✅ Ссылка на скачивание: {download_url}")
        
        # Скачиваем файл
        file_response = requests.get(download_url)
        if file_response.status_code == 200:
            ext = "mp3" if audio_only else "mp4"
            filename = f"downloads/media.{ext}"
            
            with open(filename, "wb") as f:
                f.write(file_response.content)
            
            file_size = len(file_response.content) / (1024 * 1024)  # MB
            print(f"✅ Скачано: {filename} ({file_size:.2f} MB)")
            
            # Сохраняем информацию для артефакта
            with open("downloads/info.txt", "w") as f:
                f.write(f"URL: {url}\n")
                f.write(f"Format: {FORMAT}\n")
                f.write(f"Size: {file_size:.2f} MB\n")
        else:
            print(f"❌ Ошибка скачивания: {file_response.status_code}")
            exit(1)
        EOF
        
        FILE_COUNT=$(find downloads -type f -name "*.mp*" | wc -l)
        echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
        
        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "❌ Файлы не скачаны!"
          exit 1
        else
          echo "✅ Скачано файлов: $FILE_COUNT"
          ls -lh downloads/
        fi

    - name: Upload Artifact
      if: steps.download.outputs.file_count > 0
      uses: actions/upload-artifact@v4
      with:
        name: academy-media-${{ github.run_id }}
        path: downloads/
        retention-days: 1
