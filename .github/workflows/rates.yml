name: Update rates

on:
  schedule:
    - cron: '0 * * * *' # Каждый час
  workflow_dispatch: # И по кнопке

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rates and key rate
        run: |
          python3 - <<'PY'
          import requests, xml.etree.ElementTree as ET, json, datetime, sys

          # 1. Скачиваем и парсим курсы валют (с правильной кодировкой)
          try:
              resp = requests.get('https://www.cbr.ru/scripts/XML_daily.asp')
              resp.raise_for_status()
              # ЦБ отдает windows-1251, декодируем явно
              xml_data = resp.content.decode('windows-1251')
              root = ET.fromstring(xml_data)
              
              usd = eur = None
              for valute in root.findall('Valute'):
                  char_code = valute.find('CharCode').text
                  value = valute.find('Value').text.replace(',', '.')
                  nominal = int(valute.find('Nominal').text)
                  rate = round(float(value) / nominal, 2)
                  if char_code == 'USD': usd = rate
                  if char_code == 'EUR': eur = rate
              if not usd or not eur: raise ValueError("Нет USD/EUR")
          except Exception as e:
              print(f"Ошибка при парсинге курсов: {e}")
              sys.exit(1)

          # 2. Скачиваем ключевую ставку
          try:
              kr_resp = requests.get('https://www.cbr-xml-daily.ru/keyrate.json')
              kr_resp.raise_for_status()
              key_rate = kr_resp.json().get('rate')
          except Exception as e:
              print(f"Ошибка при получении ставки: {e}")
              key_rate = None # Не роняем весь скрипт, просто не будет ставки

          # 3. Сохраняем
          rate_data = {
              'updated': datetime.datetime.utcnow().isoformat() + 'Z',
              'usd': usd,
              'eur': eur,
              'key_rate': key_rate,
              'source': 'CBR'
          }
          with open('rates.json', 'w', encoding='utf-8') as f:
              json.dump(rate_data, f, ensure_ascii=False, indent=2)
          print("Успех! Данные сохранены.")
          PY

      - name: Commit rates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Auto-update rates and key rate from CBR"
          git push
