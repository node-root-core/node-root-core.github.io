name: Update rates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rates and key rate
        run: |
          python3 - <<'PY'
          import requests, xml.etree.ElementTree as ET, json, datetime, sys, re

          # 1. Курсы валют (с правильной кодировкой)
          try:
              resp = requests.get('https://www.cbr.ru/scripts/XML_daily.asp', timeout=10)
              resp.raise_for_status()
              xml_data = resp.content.decode('windows-1251')
              root = ET.fromstring(xml_data)
              
              usd = eur = None
              for valute in root.findall('Valute'):
                  char_code = valute.find('CharCode').text
                  value = valute.find('Value').text.replace(',', '.')
                  nominal = int(valute.find('Nominal').text)
                  rate = round(float(value) / nominal, 2)
                  if char_code == 'USD': usd = rate
                  if char_code == 'EUR': eur = rate
              if not usd or not eur: raise ValueError("Нет USD/EUR")
          except Exception as e:
              print(f"Ошибка при парсинге курсов: {e}")
              sys.exit(1)

          # 2. Ключевая ставка (с фолбэком)
          key_rate = 21.0 # Дефолтное значение на случай, если API сломается
          try:
              kr_resp = requests.get('https://www.cbr-xml-daily.ru/keyrate.json', timeout=10)
              kr_resp.raise_for_status()
              rate_val = kr_resp.json().get('rate')
              if rate_val: key_rate = rate_val
          except Exception as e:
              print(f"Ошибка при получении ставки из JSON: {e}. Пробуем официальный сайт...")
              try:
                  html = requests.get('https://www.cbr.ru/hd_base/KeyRate/', timeout=10).text
                  # Ищем ставку в HTML (регулярка ищет дату, а следом за ней число с запятой)
                  match = re.search(r'<td>\d{2}\.\d{2}\.\d{4}</td>\s*<td>(\d+,\d+)</td>', html)
                  if match: key_rate = float(match.group(1).replace(',', '.'))
              except Exception as e2:
                  print(f"Не удалось спарсить HTML: {e2}. Оставляем 21.0%")

          # 3. Сохраняем
          rate_data = {
              'updated': datetime.datetime.utcnow().isoformat() + 'Z',
              'usd': usd,
              'eur': eur,
              'key_rate': key_rate,
              'source': 'CBR'
          }
          with open('rates.json', 'w', encoding='utf-8') as f:
              json.dump(rate_data, f, ensure_ascii=False, indent=2)
          print(f"Успех! Ставка: {key_rate}%, USD: {usd}, EUR: {eur}")
          PY

      - name: Commit rates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Auto-update rates and key rate"
          git push
